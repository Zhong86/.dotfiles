unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
set -g mouse 

unbind-key %
unbind-key '"'
unbind-key s

#KEYBINDS
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key s split-window -v
bind-key v split-window -h

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'dracula/tmux'

#dracula
set -g @dracula-plugins "git network-bandwidth"
set -g @dracula-show-powerline true
set -g @dracula-border-contrast true
set -g @dracula-show-left-icon "σοφία"
set -g @dracula-git-show-remote-status true
set -g @dracula-git-disable-status true

set -g @dracula-playerctl-colors "dark_gray orange"
set -g @dracula-network-bandwidth-colors "dark_gray orange "
set -g @dracula-git-colors "orange dark_gray"
set -g @dracula-time-colors "dark_gray orange"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
